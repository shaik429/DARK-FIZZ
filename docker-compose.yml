services:
  db:
    image: mysql:8.4
    container_name: stocksense-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stocksense
      MYSQL_USER: stocksense
      MYSQL_PASSWORD: stocksense
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    container_name: stocksense-mail
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysqldata:




  