<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .container {
      max-width: 700px;
      padding: 40px;
      animation: fadeIn 1.2s ease;
    }

    .rocket {
      font-size: 70px;
      margin-bottom: 25px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    h1 span {
      color: #00e5ff;
    }

    p {
      color: #9a9a9a;
      font-size: 1.1rem;
      line-height: 1.7;
      margin: 8px 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      padding: 10px 18px;
      border: 1px solid #222;
      border-radius: 50px;
      background: #0d0d0d;
      color: #bdbdbd;
      font-size: 0.9rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 12px #00e5ff;
      animation: pulse 1.5s infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="rocket">🚀</div>

    <h1>You're <span>early.</span></h1>

    <p>The project is currently being deployed.</p>

    <p>
      Check back soon — this link will take you directly
      to the final project once it's live.
    </p>

    <div class="status">
      <span class="dot"></span>
      Deployment in progress
    </div>

  </main>

</body>
</html>
